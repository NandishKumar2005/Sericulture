name: Build Android APK & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-apk:
    name: Build & Publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Mobile Dependencies & Build Web Assets
        working-directory: mobile
        env:
          VITE_API_URL: https://reshme-backend.onrender.com/api
          VITE_GOOGLE_CLIENT_ID: 821368596969-ecg9q9cj692prkp1uutckppssf6l1ccs.apps.googleusercontent.com
        run: |
          echo "VITE_API_URL=https://reshme-backend.onrender.com/api" > .env.production
          echo "VITE_GOOGLE_CLIENT_ID=821368596969-ecg9q9cj692prkp1uutckppssf6l1ccs.apps.googleusercontent.com" >> .env.production
          npm install --legacy-peer-deps
          npm run build

      - name: Sync Capacitor Android
        working-directory: mobile
        run: npx cap sync android

      - name: Ensure RECORD_AUDIO permission in AndroidManifest
        run: |
          MANIFEST="mobile/android/app/src/main/AndroidManifest.xml"
          # Inject RECORD_AUDIO if not already present
          if ! grep -q "RECORD_AUDIO" "$MANIFEST"; then
            sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />|' "$MANIFEST"
            echo "✓ Injected RECORD_AUDIO permission"
          else
            echo "✓ RECORD_AUDIO already present"
          fi
          grep "permission" "$MANIFEST"

      - name: Inject Custom App Icon
        run: |
          sudo apt-get install -y imagemagick

          SRC="mobile/assets/icon.jpeg"
          RES="mobile/android/app/src/main/res"

          # Replace ALL mipmap PNG icons
          for folder in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            case $folder in
              mipmap-mdpi)    size=48  ;;
              mipmap-hdpi)    size=72  ;;
              mipmap-xhdpi)   size=96  ;;
              mipmap-xxhdpi)  size=144 ;;
              mipmap-xxxhdpi) size=192 ;;
            esac
            convert "$SRC" -resize "${size}x${size}!" "$RES/$folder/ic_launcher.png"
            convert "$SRC" -resize "${size}x${size}!" "$RES/$folder/ic_launcher_round.png"
            convert "$SRC" -resize "${size}x${size}!" "$RES/$folder/ic_launcher_foreground.png"
            echo "✓ $folder (${size}x${size})"
          done

          # Delete adaptive icon XMLs — they override PNGs on Android 8+ and show the old foreground
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"
          # Delete conflicting vector XML foreground (causes duplicate resource error)
          rm -f "$RES/drawable-v24/ic_launcher_foreground.xml"
          echo "✓ Removed conflicting XML files"

          # Overwrite the drawable icon (used directly by AndroidManifest)
          convert "$SRC" -resize "512x512!" "$RES/drawable/ic_launcher.png"
          echo "✓ drawable/ic_launcher.png replaced"
          echo "✓ All icons replaced"

      - name: Build Android Debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p output_apk
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk output_apk/ReshmeAI-v1.0.0.apk
          ls -lh output_apk/

      - name: Update Vercel APK copy
        run: |
          cp output_apk/ReshmeAI-v1.0.0.apk web/public/ReshmeAI-v1.0.0.apk
          echo "✓ Updated web/public APK"
          ls -lh web/public/ReshmeAI-v1.0.0.apk

      - name: Commit updated APK to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/ReshmeAI-v1.0.0.apk
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "ci: update Vercel APK with latest build [skip ci]"
          git fetch origin main
          git merge -X theirs origin/main --no-edit
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReshmeAI-v1.0.0
          path: output_apk/ReshmeAI-v1.0.0.apk

      - name: Delete existing release if present
        run: gh release delete v1.0.0 --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: ReshmeAI Android APK v1.0.0
          body: |
            Official Android APK for ReshmeAI Smart Sericulture App.
            Compatible with Android 8.0+. Enable "Install from Unknown Sources" before installing.
          files: output_apk/ReshmeAI-v1.0.0.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
