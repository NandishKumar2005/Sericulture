name: Build Android APK & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-apk:
    name: Build & Publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Mobile Dependencies & Build Web Assets
        run: |
          cd mobile
          npm install --legacy-peer-deps
          npm run build

      - name: Sync Capacitor Android
        run: |
          cd mobile
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename & Prepare APK Artifact
        run: |
          mkdir -p output_apk
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk output_apk/ReshmeAI-v1.0.0.apk

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReshmeAI-v1.0.0.apk
          path: output_apk/ReshmeAI-v1.0.0.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: ReshmeAI Android APK Release v1.0.0
          body: |
            Official compiled Android APK binary for ReshmeAI Smart Sericulture Mobile App.
            Compatible with Android 8.0+.
          files: output_apk/ReshmeAI-v1.0.0.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
