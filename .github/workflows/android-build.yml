name: Build Android APK & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-apk:
    name: Build & Publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Mobile Dependencies & Build Web Assets
        working-directory: mobile
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Sync Capacitor Android
        working-directory: mobile
        run: npx cap sync android

      - name: Build Android Debug APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p output_apk
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk output_apk/ReshmeAI-v1.0.0.apk
          ls -lh output_apk/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReshmeAI-v1.0.0
          path: output_apk/ReshmeAI-v1.0.0.apk

      - name: Delete existing release if present
        run: gh release delete v1.0.0 --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: ReshmeAI Android APK v1.0.0
          body: |
            Official Android APK for ReshmeAI Smart Sericulture App.
            Compatible with Android 8.0+. Enable "Install from Unknown Sources" before installing.
          files: output_apk/ReshmeAI-v1.0.0.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
