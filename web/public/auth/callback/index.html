<!DOCTYPE html>
<html>
<head>
  <title>Completing sign in...</title>
  <style>
    body { background: #0f172a; color: #fff; font-family: Arial, sans-serif;
           display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .msg { text-align: center; }
    .spinner { width: 40px; height: 40px; border: 3px solid #334155;
               border-top-color: #10b981; border-radius: 50%;
               animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="msg"><div class="spinner"></div><p>Completing sign in...</p></div>
<script>
  const p     = new URLSearchParams(window.location.search);
  const code  = p.get('code');
  const state = p.get('state');
  const error = p.get('error');

  const msg = { type: 'google_oauth', code, state, error };

  // Post to parent window (Capacitor in-app browser's parent is the app webview)
  if (window.opener) {
    window.opener.postMessage(msg, '*');
  } else {
    // Capacitor Browser: parent IS the app webview
    window.parent.postMessage(msg, '*');
  }

  // Also store in localStorage as fallback
  localStorage.setItem('oauth_code', code || '');
  localStorage.setItem('oauth_state', state || '');
  localStorage.setItem('oauth_error', error || '');
  localStorage.setItem('oauth_ts', Date.now().toString());

  // Close this window/tab after a moment
  setTimeout(() => window.close(), 800);
</script>
</body>
</html>
