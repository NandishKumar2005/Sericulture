<!DOCTYPE html>
<html>
<head>
  <title>Completing sign in...</title>
  <style>
    body { background: #0f172a; color: #fff; font-family: Arial, sans-serif;
           display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .msg { text-align: center; }
    .spinner { width: 40px; height: 40px; border: 3px solid #334155;
               border-top-color: #10b981; border-radius: 50%;
               animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="msg">
  <div class="spinner"></div>
  <p>Completing sign in...</p>
</div>
<script>
  // Grab all query params from Google's redirect
  const params = window.location.search; // ?code=...&state=...

  // Redirect to custom scheme — Android intercepts this via intent filter
  const deepLink = 'reshmeai://auth' + params;

  // Try deep link redirect immediately
  window.location.href = deepLink;

  // Fallback: if deep link doesn't work (browser context), show message
  setTimeout(() => {
    document.querySelector('.msg').innerHTML =
      '<p>Sign-in complete. Please return to the ReshmeAI app.</p>';
  }, 2000);
</script>
</body>
</html>
