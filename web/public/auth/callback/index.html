<!DOCTYPE html>
<html>
<head>
  <title>Completing sign in...</title>
  <style>
    body { background: #0f172a; color: #fff; font-family: Arial, sans-serif;
           display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .msg { text-align: center; }
    .spinner { width: 40px; height: 40px; border: 3px solid #334155;
               border-top-color: #10b981; border-radius: 50%;
               animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .err { color: #f87171; font-size: 14px; margin-top: 12px; max-width: 300px; }
  </style>
</head>
<body>
<div class="msg">
  <div class="spinner"></div>
  <p>Completing sign in...</p>
  <div class="err" id="err"></div>
</div>
<script>
(async function() {
  const params = new URLSearchParams(window.location.search);
  const code  = params.get('code');
  const state = params.get('state');
  const error = params.get('error');

  if (error) {
    document.getElementById('err').textContent = 'Google sign-in denied: ' + error;
    return;
  }
  if (!code) {
    document.getElementById('err').textContent = 'No auth code received.';
    return;
  }

  const codeVerifier = sessionStorage.getItem('pkce_verifier');
  const savedState   = sessionStorage.getItem('pkce_state');
  const redirectUri  = window.location.origin + '/auth/callback';

  try {
    const res = await fetch('https://reshme-backend.onrender.com/api/auth/google-callback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code, code_verifier: codeVerifier, redirect_uri: redirectUri }),
    });

    const data = await res.json();
    if (!res.ok || !data.token) throw new Error(data.message || 'Sign-in failed');

    // Store in localStorage for the webview to read when we navigate back
    localStorage.setItem('token', data.token);
    localStorage.setItem('user', JSON.stringify(data.user));
    localStorage.setItem('google_auth_complete', '1');

    // Try deep link back to APK first
    const deepLink = 'reshmeai://auth-done';
    window.location.href = deepLink;

    // Fallback: navigate back to the app root after 1.5s if deep link didn't work
    setTimeout(() => {
      window.location.href = '/';
    }, 1500);

  } catch (err) {
    document.getElementById('err').textContent = err.message;
  }
})();
</script>
</body>
</html>
