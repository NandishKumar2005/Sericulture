<!DOCTYPE html>
<html>
<head>
  <title>Sign in complete</title>
  <style>
    body { background: #0f172a; color: #fff; font-family: Arial, sans-serif;
           display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .box { text-align: center; padding: 32px; }
    .spinner { width: 40px; height: 40px; border: 3px solid #334155; border-top-color: #10b981;
               border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .check { font-size: 48px; display: none; margin-bottom: 12px; }
    h2 { margin: 0 0 8px; font-size: 20px; }
    p  { color: #94a3b8; font-size: 14px; margin: 0; }
    .err { color: #f87171; }
  </style>
</head>
<body>
<div class="box">
  <div class="spinner" id="spin"></div>
  <div class="check" id="check">✅</div>
  <h2 id="title">Completing sign in...</h2>
  <p id="sub">Please wait</p>
</div>
<script>
(async () => {
  const params = new URLSearchParams(window.location.search);
  const code   = params.get('code');
  const state  = params.get('state') || '';
  const error  = params.get('error');

  // sessionId and verifier are encoded in state as "sessionId|verifier"
  const parts      = state.split('|');
  const sessionId  = parts[0] || '';
  const verifier   = parts[1] || '';
  const redirectUri = window.location.origin + '/auth/callback';

  const show = (icon, title, sub, isErr) => {
    document.getElementById('spin').style.display  = 'none';
    document.getElementById('check').style.display = 'block';
    document.getElementById('check').textContent   = icon;
    document.getElementById('title').textContent   = title;
    document.getElementById('sub').textContent     = sub;
    if (isErr) document.getElementById('sub').classList.add('err');
  };

  if (!sessionId) {
    show('❌', 'Error', 'Missing session ID. Please try again.', true);
    return;
  }

  try {
    const res = await fetch('https://reshme-backend.onrender.com/api/auth/google-session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId, code, code_verifier: verifier, redirect_uri: redirectUri, error }),
    });
    const data = await res.json();
    if (data.success) {
      show('✅', 'Signed in!', 'Go back to the ReshmeAI app to continue.', false);
    } else {
      show('❌', 'Sign-in failed', data.message || 'Please try again.', true);
    }
  } catch(e) {
    show('❌', 'Network error', e.message, true);
  }
})();
</script>
</body>
</html>
