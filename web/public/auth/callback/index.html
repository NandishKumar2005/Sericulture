<!DOCTYPE html>
<html>
<head>
  <title>Completing sign in...</title>
  <style>
    body { background: #0f172a; color: #fff; font-family: Arial, sans-serif;
           display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .msg { text-align: center; }
    .spinner { width: 40px; height: 40px; border: 3px solid #334155;
               border-top-color: #10b981; border-radius: 50%;
               animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="msg"><div class="spinner"></div><p>Completing sign in...</p></div>
<script>
(async function() {
  const p           = new URLSearchParams(window.location.search);
  const code        = p.get('code');
  const state       = p.get('state');
  const error       = p.get('error');
  const sessionId   = localStorage.getItem('oauth_session_id');
  const codeVerifier = localStorage.getItem('oauth_verifier');
  const redirectUri  = window.location.origin + '/auth/callback';

  await fetch('https://reshme-backend.onrender.com/api/auth/google-session', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sessionId, code, code_verifier: codeVerifier, redirect_uri: redirectUri, error }),
  }).catch(() => {});

  document.querySelector('p').textContent = 'Sign-in complete! Return to the app.';
  // Close the in-app browser — Capacitor Browser will detect this
  window.close();
})();
</script>
</body>
</html>
