<!DOCTYPE html>
<html>
<head>
  <title>Completing sign in...</title>
  <style>
    body { background: #0f172a; color: #fff; font-family: Arial, sans-serif;
           display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .msg { text-align: center; }
    .spinner { width: 40px; height: 40px; border: 3px solid #334155;
               border-top-color: #10b981; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="msg">
  <div class="spinner"></div>
  <p>Completing sign in...</p>
</div>
<script>
  const currentUrl = window.location.href;

  // Method 1: postMessage to parent (Capacitor webview is the parent)
  if (window.opener) {
    window.opener.postMessage({ type: 'oauth_callback', url: currentUrl }, '*');
    setTimeout(() => window.close(), 500);
  } else {
    // Method 2: postMessage to the Capacitor webview via parent frame
    try {
      window.parent.postMessage({ type: 'oauth_callback', url: currentUrl }, '*');
    } catch(e) {}

    // Method 3: Use Capacitor App plugin deep link if available
    try {
      if (window.Capacitor) {
        window.Capacitor.Plugins.App?.openUrl?.({ url: currentUrl });
      }
    } catch(e) {}

    // Method 4: Store in localStorage as fallback for polling
    try {
      localStorage.setItem('oauth_callback_url', currentUrl);
      localStorage.setItem('oauth_callback_time', Date.now().toString());
    } catch(e) {}
  }
</script>
</body>
</html>
